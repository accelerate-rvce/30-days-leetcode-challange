name: Wake verification service

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render and process a verification batch
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$BACKEND_URL"
          curl --fail --silent --show-error --max-time 30 \
            -H "x-cron-secret: $CRON_SECRET" \
            -X POST "$BACKEND_URL/api/cron/verify"
