services:
  - type: web
    name: leet-frontend
    runtime: node
    plan: free
    rootDir: frontend/app
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      # Public URLs. If Render appends a suffix to a service name, update these
      # to the actual onrender.com URLs shown in the dashboard.
      - key: NEXT_PUBLIC_API_URL
        value: https://leet-backend.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://leet-frontend.onrender.com
      - key: NEXT_PUBLIC_DEMO_ROLE
        value: student
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

  - type: web
    name: leet-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      # Comma-separated list of allowed browser origins.
      - key: FRONTEND_ORIGIN
        value: https://leet-frontend.onrender.com
      - key: CHALLENGE_TIMEZONE
        value: Asia/Kolkata
      - key: LEETCODE_GRAPHQL_URL
        value: https://leetcode.com/graphql
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Verification worker. Render background workers require a paid instance
  # type, so this is disabled by default. Uncomment and set the plan to run it.
  # - type: worker
  #   name: leet-worker
  #   runtime: node
  #   plan: starter
  #   rootDir: backend
  #   buildCommand: npm ci && npm run build
  #   startCommand: npm run start:worker
  #   autoDeploy: true
  #   envVars:
  #     - key: NODE_VERSION
  #       value: 22.22.2
