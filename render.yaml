services:
  - type: web
    name: leet-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      # Your deployed frontend origin (Vercel). Comma-separate to allow several,
      # e.g. https://leet.vercel.app,https://leet-git-main.vercel.app
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CHALLENGE_TIMEZONE
        value: Asia/Kolkata
      - key: LEETCODE_GRAPHQL_URL
        value: https://leetcode.com/graphql
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CRON_SECRET
        sync: false

  # Verification worker. Render background workers require a paid instance
  # type, so this is disabled by default. Uncomment and set the plan to run it.
  # - type: worker
  #   name: leet-worker
  #   runtime: node
  #   plan: starter
  #   rootDir: backend
